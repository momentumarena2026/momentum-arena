name: Seed NAVRATRI25 Coupon

# Creates or refreshes the Navratri festival coupon: 25% off cricket and
# football for every slot PLAYED during the nine days (11–19 Oct 2026,
# IST, inclusive), auto-applied, peak and off-peak alike.
#
# Idempotent — safe to re-run. It updates the coupon in place and
# re-syncs the play-date window, so correcting the dates is a matter of
# editing the constants in the script and running this again.
#
# Defaults to STAGING. Production is a deliberate choice in the dropdown.
#
#   gh workflow run seed-navratri-coupon.yml -f environment=staging
#   gh workflow run seed-navratri-coupon.yml -f environment=production -f dry_run=true

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which DB to write to"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: "Print what would change and write nothing"
        required: false
        default: false
        type: boolean

jobs:
  seed-coupon:
    name: Seed NAVRATRI25
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ inputs.environment == 'production' && secrets.PRODUCTION_DB_URL || secrets.STAGING_DB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty for environment=${{ inputs.environment }}"
            exit 1
          fi
          echo "DATABASE_URL is set (${#DATABASE_URL} chars) for ${{ inputs.environment }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Seed NAVRATRI25
        run: npx tsx scripts/seed-navratri-coupon.ts ${{ inputs.dry_run && '--dry-run' || '' }}
