name: iOS native build

# Manually triggered build + upload of a NATIVE iOS build to TestFlight / the App
# Store. Runs on a macOS runner (free for public repos). Signing: imports an
# existing Apple Distribution certificate (.p12) into a temporary keychain; the
# App Store Connect API key then handles provisioning profiles automatically via
# -allowProvisioningUpdates (so no profile needs to be checked in).
#
#   track = testflight  -> TestFlight  (OTA target: development)
#   track = appstore    -> App Store   (OTA target: production)
#
# Required repo secrets:
#   IOS_DIST_CERT_BASE64    - base64 of the Apple Distribution certificate .p12
#   IOS_DIST_CERT_PASSWORD  - the .p12 export password
#   ASC_API_KEY_P8_BASE64   - base64 of AuthKey_XLBK5M2393.p8 (App Store Connect API key)
#
# Build number is auto-generated (unix-epoch-minutes) by the fastlane lanes.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Where to publish"
        type: choice
        options: [testflight, appstore]
        default: testflight
      bump:
        description: "App version bump (semver)"
        type: choice
        options: [none, patch, minor, major]
        default: none

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Must match the local toolchain (Xcode 26.x). The macos-15 runner's newest
    # Xcode was 16.4, which couldn't resolve the project's packages.
    runs-on: macos-26
    env:
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
    outputs:
      build: ${{ steps.bn.outputs.build }}
      channel: ${{ steps.bn.outputs.channel }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute build number + channel
        id: bn
        run: |
          echo "build=$(node apps/mobile/scripts/next-build-number.js)" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.track }}" = "appstore" ]; then
            echo "channel=production" >> "$GITHUB_OUTPUT"
          else
            echo "channel=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve app version (optional bump)
        id: bump
        run: echo "version=$(node apps/mobile/scripts/version.js '${{ inputs.bump }}')" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile

      - name: Install mobile JS deps
        working-directory: apps/mobile
        run: npm ci

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Import Apple Distribution certificate into a temp keychain
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KP="actions-temp-pwd"
          echo "$IOS_DIST_CERT_BASE64" | base64 -d > "$CERT_PATH"
          security create-keychain -p "$KP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KP" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_XLBK5M2393.p8

      - name: Build IPA + upload
        working-directory: apps/mobile
        env:
          LANE: ${{ inputs.track == 'appstore' && 'release' || 'beta' }}
          BUILD_NUMBER: ${{ steps.bn.outputs.build }}
          MARKETING_VERSION: ${{ steps.bump.outputs.version }}
        run: bundle exec fastlane ios "$LANE"

      - name: Dump raw xcodebuild log on failure
        if: failure()
        run: |
          echo "===== gym raw build log (tail 200) ====="
          tail -200 ~/Library/Logs/gym/MomentumArena-MomentumArena.log 2>/dev/null || echo "(no gym log found)"

  # After a successful upload: bump the fingerprint baseline + version gate.
  post_release:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/post-native-release.yml
    with:
      platform: ios
      channel: ${{ needs.build.outputs.channel }}
      build: ${{ needs.build.outputs.build }}
      versionName: ${{ needs.build.outputs.version }}
      storeUrl: "https://apps.apple.com/app/id6783955158"
    secrets: inherit
