name: Backfill slot-block provenance (production)

# Blocks raised before provenance existed say only "Tournament window" —
# true of every tournament and every sport, and so useless to an admin
# deciding whether a blocked Tuesday can move. This traces each one back
# to the tournament or camp that claims it (via slotBlockIds) and writes
# the real label. Blocks nothing claims are left untouched.
#
# ── Why this runs on EVERY push to main, with no path filter ──────────
#
# It first shipped as a manual workflow, and the button was never pressed
# — the calendar kept saying "Tournament window" through two promotions.
# It was then folded into seed-production.yml, which is path-filtered to
# prisma/**; the commit that added it touched no schema files, so it did
# not run either. Both attempts failed the same way: the fix was gated
# behind something that did not happen.
#
# So: no gate. It is a single indexed query on an empty result set once
# the data is clean, which is cheaper than reasoning about when it ought
# to run.
on:
  push:
    branches:
      - main
  # Manual runs can DRY RUN, which the automatic path deliberately cannot
  # — seeing what would change is a thing you ask for, not a default.
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually write (unticked = dry run, prints what would change)"
        type: boolean
        default: false

jobs:
  backfill:
    name: Backfill block provenance
    runs-on: ubuntu-latest
    # Never fails the pipeline. This makes calendar labels nicer; it must
    # not be able to redden a deploy that was otherwise fine.
    continue-on-error: true
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty! Add PRODUCTION_DB_URL to repository secrets."
            exit 1
          fi
          echo "DATABASE_URL is set (${#DATABASE_URL} chars)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run backfill
        run: |
          # A push always applies — that is the whole point of it being
          # automatic. A manual run honours the tickbox.
          ARGS=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="--apply"
          fi
          echo "Running: npx tsx scripts/backfill-block-provenance.ts $ARGS"
          npx tsx scripts/backfill-block-provenance.ts $ARGS 2>&1 | tee backfill.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Block provenance — ${{ github.event_name == 'push' && 'APPLIED (automatic)' || (inputs.apply == true && 'APPLIED' || 'DRY RUN') }}"
            echo ""
            echo '```'
            tail -60 backfill.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
