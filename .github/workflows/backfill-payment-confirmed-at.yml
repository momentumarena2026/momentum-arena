name: Backfill Payment.confirmedAt (production)

# Every cash-basis figure filters on Payment.confirmedAt — the Sports
# Earnings KPI, "Today's Earning", the CA report. A payment marked
# COMPLETED without one is money collected that none of them can see.
#
# Manual only. Defaults to a DRY RUN — you must tick `apply` to write.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually write (unticked = dry run, lists what would change)"
        type: boolean
        default: false

jobs:
  backfill:
    name: Backfill confirmedAt
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty! Add PRODUCTION_DB_URL to repository secrets."
            exit 1
          fi
          echo "DATABASE_URL is set (${#DATABASE_URL} chars)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run backfill
        run: |
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="--apply"; fi
          npx tsx scripts/backfill-payment-confirmed-at.ts $ARGS 2>&1 | tee backfill.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Backfill Payment.confirmedAt — ${{ inputs.apply == true && 'APPLIED' || 'DRY RUN' }}"
            echo ""
            echo '```'
            cat backfill.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
