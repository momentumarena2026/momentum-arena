name: OTA publish

# On every push to development/main, decide per platform whether the change is
# JS-only (fingerprint unchanged vs the last shipped native build) → publish a
# DRAFT OTA release (admin then rolls it out from /admin/ota), or native
# (fingerprint changed) → warn that a new store build is required.
#
# Required repo secrets:
#   STAGING_DB_URL         - Neon URL for the development/staging DB
#   PRODUCTION_DB_URL      - Neon URL for the production DB
#   BLOB_READ_WRITE_TOKEN  - Vercel Blob token (momentum-arena-OTA store)
# The manifest is signed server-side, so EXPO_OTA_PRIVATE_KEY is NOT needed here.

on:
  push:
    branches: [development, main]
    # Only run when the mobile app (or the publish script) actually changes.
    # Web-only pushes don't change the JS bundle, so publishing a DRAFT for them
    # is wasteful (and needlessly exposes the job to flaky npm/network blips).
    paths:
      - "apps/mobile/**"
      - "scripts/publish-ota.ts"
  workflow_dispatch: {} # allow manual publish without a mobile change

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: true

# actions:write lets a detected native change auto-dispatch the native build
# workflow (workflow_dispatch via GITHUB_TOKEN is allowed to trigger runs).
permissions:
  contents: read
  actions: write

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve channel + runtimeVersion
        id: cfg
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "channel=production" >> "$GITHUB_OUTPUT"
          else
            echo "channel=development" >> "$GITHUB_OUTPUT"
          fi
          RTV=$(node -e "process.stdout.write(require('./apps/mobile/app.json').expo.runtimeVersion)")
          echo "runtime=$RTV" >> "$GITHUB_OUTPUT"

      - name: Install root deps (prisma + @vercel/blob + tsx)
        run: npm ci

      - name: Install mobile deps (expo export + fingerprint need node_modules)
        working-directory: apps/mobile
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Decide + publish per platform
        env:
          # Branch-selected DB, read straight from secrets (never via an output).
          DATABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.PRODUCTION_DB_URL || secrets.STAGING_DB_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          CHANNEL: ${{ steps.cfg.outputs.channel }}
          RUNTIME: ${{ steps.cfg.outputs.runtime }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
          # Production OTAs auto-publish at this rollout %; an admin promotes to
          # 100% from /admin/ota once healthy. Development stays DRAFT (manual).
          OTA_CANARY_PERCENT: "20"
        run: |
          set -e
          # Platforms that did NOT get an OTA this run (missing baseline or
          # fingerprint drift). Collected so the job can shout about it — a
          # silent per-platform skip is how production/ios went 3 days
          # without an OTA while android kept publishing, on green runs.
          BLOCKED=""
          for PLATFORM in ios android; do
            echo "::group::fingerprint $PLATFORM"
            # Current native fingerprint for this platform.
            CUR=$(cd apps/mobile && npx expo-updates fingerprint:generate --platform "$PLATFORM" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).hash))")
            BASELINE_FILE="apps/mobile/fingerprints/${CHANNEL}.${PLATFORM}.fingerprint"
            BASE=$( [ -f "$BASELINE_FILE" ] && cat "$BASELINE_FILE" || echo "" )
            echo "current=$CUR baseline=${BASE:-<none>}"
            echo "::endgroup::"

            if [ -z "$BASE" ]; then
              echo "::warning::No fingerprint baseline for $CHANNEL/$PLATFORM — skip (commit a baseline when you ship the native build)."
              BLOCKED="$BLOCKED $PLATFORM(no-baseline)"
              continue
            fi
            if [ "$CUR" != "$BASE" ]; then
              echo "::warning::NATIVE change detected for $CHANNEL/$PLATFORM (fingerprint differs) — a new store build is required; not publishing OTA."
              BLOCKED="$BLOCKED $PLATFORM(drift)"
              # Auto-trigger a native store build on BOTH branches, dispatched
              # against the branch that was pushed so main builds main's code.
              #
              # The track follows the CHANNEL, and it has to: the store track is
              # what decides which OTA endpoint gets baked into the binary
              # (fastlane's beta lane runs configure_ota development, release
              # runs production) and which fingerprint baseline post_release
              # then writes.
              #
              #   development -> TestFlight / Play internal   (OTA=development)
              #   main        -> App Store  / Play production (OTA=production)
              #
              # Dispatching main to a TEST track — which this did until
              # 2026-09-01 — is a trap that looks harmless and is not. It
              # produces a main binary wired to the DEVELOPMENT OTA channel, and
              # it refreshes development.<platform>.fingerprint while leaving
              # production.<platform>.fingerprint stale. Production OTA is then
              # blocked forever: every later push to main fails this job, fires
              # another test-track build, and moves the wrong baseline again.
              # Three consecutive red main runs on 2026-08-31 were exactly that.
              #
              # Nothing reaches a customer without a human. Neither production
              # lane publishes: ios release is submit_for_review false (an App
              # Store draft awaiting Submit), android release is
              # release_status draft (an unpublished Play release). The build
              # is automatic; shipping it stays a deliberate act, the same way
              # an OTA canary is promoted by hand.
              if [ "$CHANNEL" = "production" ]; then
                if [ "$PLATFORM" = "ios" ]; then WF=native-ios.yml; TRACK=appstore; else WF=native-android.yml; TRACK=production; fi
              else
                if [ "$PLATFORM" = "ios" ]; then WF=native-ios.yml; TRACK=testflight; else WF=native-android.yml; TRACK=internal; fi
              fi
              echo "↻ Auto-dispatching $WF (track=$TRACK, ref=$GITHUB_REF_NAME) for the native change…"
              gh workflow run "$WF" --ref "$GITHUB_REF_NAME" -f track="$TRACK" \
                || echo "::warning::could not auto-dispatch $WF"
              continue
            fi

            if [ "$CHANNEL" = "production" ]; then
              # Production: auto-publish as a CANARY (partial rollout). An admin
              # promotes it to 100% from /admin/ota once it looks healthy.
              echo "JS-only change for $CHANNEL/$PLATFORM → publishing CANARY OTA @ ${OTA_CANARY_PERCENT}% (runtime $RUNTIME)"
              npx tsx scripts/publish-ota.ts \
                --channel "$CHANNEL" --platform "$PLATFORM" --runtime "$RUNTIME" \
                --changelog "${COMMIT_MSG:0:200}" \
                --publish --rollout "$OTA_CANARY_PERCENT"
            else
              echo "JS-only change for $CHANNEL/$PLATFORM → publishing DRAFT OTA (runtime $RUNTIME)"
              npx tsx scripts/publish-ota.ts \
                --channel "$CHANNEL" --platform "$PLATFORM" --runtime "$RUNTIME" \
                --changelog "${COMMIT_MSG:0:200}"
            fi
          done
          if [ -n "$BLOCKED" ]; then
            {
              echo "### ⚠️ No OTA published for $CHANNEL:$BLOCKED"
              echo ""
              echo "The JS bundle no longer matches the native runtime of the shipped"
              echo "store build, so publishing would hand installed apps JS their binary"
              echo "can't run."
              echo ""
              echo "Unblock: ship a new store build for the platform(s) above, then commit"
              echo "the refreshed \`apps/mobile/fingerprints/${CHANNEL}.<platform>.fingerprint\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Development self-heals (the native build is auto-dispatched above), so
          # a skip there stays a warning. Production has no such escape hatch — fail
          # the run so a blocked platform can't rot behind a green checkmark.
          if [ "$CHANNEL" = "production" ] && [ -n "$BLOCKED" ]; then
            echo "::error::Production OTA did not publish for:$BLOCKED — a store build has been dispatched (App Store draft / Play draft); production users get this change only once you submit and it ships. See the job summary."
            exit 1
          fi
