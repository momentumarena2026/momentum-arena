name: Backfill paidAt (production)

# Cash-basis reporting keys off TournamentTeam.paidAt / CampRegistration.paidAt.
# Rows confirmed before those columns existed have paidAt = null, so their money
# is invisible to analytics and the CA report. This backfills them from the
# confirmation timestamp.
#
# Manual only. Defaults to a DRY RUN — you must tick `apply` to write.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually write (unticked = dry run, prints what would change)"
        type: boolean
        default: false
      since:
        description: "Only rows on/after this date (YYYY-MM-DD). Blank = all."
        type: string
        default: ""

jobs:
  backfill:
    name: Backfill paidAt
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty! Add PRODUCTION_DB_URL to repository secrets."
            exit 1
          fi
          echo "DATABASE_URL is set (${#DATABASE_URL} chars)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run backfill
        run: |
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ -n "${{ inputs.since }}" ]; then ARGS="$ARGS --since ${{ inputs.since }}"; fi
          echo "Running: npx tsx scripts/backfill-paid-at.ts $ARGS"
          npx tsx scripts/backfill-paid-at.ts $ARGS 2>&1 | tee backfill.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Backfill paidAt — ${{ inputs.apply == true && 'APPLIED' || 'DRY RUN' }}"
            echo ""
            echo '```'
            tail -40 backfill.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
