name: Seed Production DB

on:
  push:
    branches:
      - main
    # Path-filtered: only schema/seed/cleanup changes need a DB sync. This
    # replaces the retired "[skip ci]" convention (footgun: GitHub matches
    # the token ANYWHERE in the message - see 2026-07-02 incident). The
    # Vercel build also runs db push (scripts/vercel-build.sh), so this
    # workflow is belt-and-suspenders for the DB + owns seeding.
    paths:
      - "prisma/**"
  # Manual recovery hatch (never required in the normal flow).
  workflow_dispatch: {}

jobs:
  seed:
    name: Seed Production Database
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty! Add PRODUCTION_DB_URL to repository secrets."
            exit 1
          fi
          echo "DATABASE_URL is set (${#DATABASE_URL} chars)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Pre-push data cleanup (idempotent)
        run: npx prisma db execute --file ./prisma/scripts/pre-db-push-cleanup.sql --schema ./prisma/schema.prisma

      - name: Push schema to production DB
        run: npx prisma db push --accept-data-loss --skip-generate

      - name: Seed production database
        run: npx tsx prisma/seed.ts

      # Runs on every schema push, like the seed above, and for the same
      # reason: a one-off that needs someone to remember to click it is a
      # one-off that does not happen. Safe to repeat — it only fills in
      # blocks whose owner was never recorded, so once every row has a
      # source it finds nothing and exits.
      #
      # Never fails the job. This makes calendar labels nicer; it must not
      # be able to block a schema deploy.
      - name: Backfill slot-block provenance (idempotent)
        continue-on-error: true
        run: npx tsx scripts/backfill-block-provenance.ts --apply
