name: Prize passes — diagnose / issue (production)

# A prize pass that fails to issue used to leave no trace anywhere: the
# completion path discarded the reason, so the first anyone knew was a
# winner asking where their pass was. The reason is reported at completion
# now, but a tournament already closed needs a way to ask after the fact —
# and a way to mint what is owed without re-completing it.
#
# Dry run by default. Issuing is idempotent (one marker per tournament and
# place), so a re-run cannot double-award.

on:
  workflow_dispatch:
    inputs:
      tournament:
        description: "Slug, or any part of the name (e.g. momentum-t10-cup)"
        required: true
        type: string
      apply:
        description: "Actually issue what is owed (unticked = diagnose only)"
        type: boolean
        default: false

jobs:
  prizes:
    name: Prize passes
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty! Add PRODUCTION_DB_URL to repository secrets."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run
        run: |
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="--apply"; fi
          npx tsx scripts/diagnose-prize-passes.ts "${{ inputs.tournament }}" $ARGS 2>&1 | tee prizes.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Prize passes — ${{ inputs.apply == true && 'APPLIED' || 'DIAGNOSE ONLY' }}"
            echo ""
            echo '```'
            tail -60 prizes.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
