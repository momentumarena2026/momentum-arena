name: Repair production data (one-offs)

# Targeted, reviewed data repairs. Each task is a named script in the
# repo, not free-form SQL, so what ran is visible in the diff and in the
# run log rather than only in somebody's terminal history.
#
# Defaults to STAGING and to a DRY RUN. Both have to be changed on
# purpose.
#
#   gh workflow run repair-production-data.yml \
#     -f environment=production -f task=dqr-partial-status -f dry_run=true

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Which repair to run"
        required: true
        type: choice
        options:
          # Payments stamped COMPLETED while a 50% advance still owes
          # money — the rows written before lib/dqr-settlement.ts.
          - dqr-partial-status
          # Clear a tournament's drive send history, resetting the
          # per-person streak cap.
          - reset-reg-drive-streak
      environment:
        description: "Which DB to write to"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: "Print what would change and write nothing"
        required: false
        default: true
        type: boolean
      slug:
        description: "reset-reg-drive-streak only — the tournament slug"
        required: false
        type: string
      include_today:
        description: "reset-reg-drive-streak only — also clear TODAY's rows (they are the idempotency guard; safe only once today's send hour has passed)"
        required: false
        default: false
        type: boolean

jobs:
  repair:
    name: ${{ inputs.task }} on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ inputs.environment == 'production' && secrets.PRODUCTION_DB_URL || secrets.STAGING_DB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty for environment=${{ inputs.environment }}"
            exit 1
          fi
          echo "DATABASE_URL is set (${#DATABASE_URL} chars) for ${{ inputs.environment }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Repair — DQR partial status
        if: ${{ inputs.task == 'dqr-partial-status' }}
        run: npx tsx scripts/repair-dqr-partial-status.ts ${{ inputs.dry_run && '--dry-run' || '--allow-production' }}

      - name: Repair — reset registration-drive streak
        if: ${{ inputs.task == 'reset-reg-drive-streak' }}
        run: |
          if [ -z "${{ inputs.slug }}" ]; then
            echo "::error::This task needs a tournament slug."
            exit 1
          fi
          npx tsx scripts/reset-reg-drive-streak.ts \
            --slug=${{ inputs.slug }} \
            ${{ inputs.dry_run && '--dry-run' || '--allow-production' }} \
            ${{ inputs.include_today && '--include-today' || '' }}
