name: Seed Daily Push Lines

# Installs the starting creative library for the daily push.
#
# Idempotent by title: a line already in the database keeps its text,
# its tags and its rotation state. This adds what is missing and
# overwrites nothing, so it is safe to re-run after the venue has
# rewritten half the copy — and safe to run again when new default
# lines are added to lib/daily-push-library.ts.
#
# Manual only. The library is content, not schema: it should arrive
# when somebody decides the copy is ready, not as a side effect of a
# deploy that happened to touch prisma/**.
#
#   gh workflow run seed-daily-push-lines.yml -f environment=production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which DB to write to"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  seed-lines:
    name: Seed the daily-push line library
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ inputs.environment == 'production' && secrets.PRODUCTION_DB_URL || secrets.STAGING_DB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty for environment=${{ inputs.environment }}"
            exit 1
          fi
          echo "DATABASE_URL is set (${#DATABASE_URL} chars) for ${{ inputs.environment }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Seed the line library
        run: npx tsx scripts/seed-daily-push-lines.ts --allow-production

      - name: Show what is now installed
        run: npx tsx scripts/seed-daily-push-lines.ts --list
